name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:20-alpine base image in the Dockerfile.
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t gulf-property-alpha:ci .
      - name: Smoke-test the app on its sample dataset
        run: |
          docker run -d --name app -p 3000:3000 gulf-property-alpha:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/home; then
              curl -fsS http://localhost:3000/api/sources/health | jq -e '.ok == true' > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
